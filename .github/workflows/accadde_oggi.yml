name: Rubrica Accadde Oggi

on:
  workflow_dispatch:

concurrency:
  group: accadde-oggi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Esegui i test
        run: python -m unittest discover -s tests -v

      - name: Esegui Accadde Oggi
        env:
          TZ: Europe/Rome
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u script.py

      - name: Salva lo storico
        if: success()
        run: |
          if git diff --quiet -- data/eventi_pubblicati.json; then
            echo "Nessun nuovo evento da registrare."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventi_pubblicati.json
          git commit -m "chore: aggiorna storico eventi pubblicati [skip ci]"
          git push

      - name: Pulisci i run completati
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/accadde_oggi.yml/runs?status=completed&per_page=100"             --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            echo "Elimino run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$RUN_ID" || true
          done

          echo "Pulizia completata."
